<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><title>Primeiro acesso · EDGE Cobranças</title></head><body><div class="login-shell"><div class="login-card"><h1>Primeiro acesso</h1><p class="muted">Crie a senha administrativa do sistema de cobranças.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label>Senha</label><input class="form-control" type="password" name="password" required minlength="8"></div><div class="form-group"><label>Confirmar senha</label><input class="form-control" type="password" name="confirm" required minlength="8"></div><button class="btn btn-primary" style="width:100%">Criar acesso</button></form></div></div></body></html>
