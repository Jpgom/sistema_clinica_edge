<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fb">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=edge-theme-20260923">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
(function(){
  try {
    var saved = localStorage.getItem('edge-theme');
    var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
</head>
<body>
<div class="login-page">
  <section class="login-card">
    <div class="brand login-brand">
      <img class="brand-logo" src="{{ url_for('static', filename='logo_edge.png') }}" alt="EDGE Medicina do Trabalho">
      <div>EDGE<small>Sistema interno</small></div>
    </div>
    <h1>Acesso restrito</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="field">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <div class="actions">
        <button class="btn btn--primary" type="submit">Entrar</button>
      </div>
    </form>
  </section>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>

<button type="button" class="edge-theme-toggle" id="edgeThemeToggle" aria-label="Alternar tema" title="Alternar tema">
  <span class="edge-theme-icon" aria-hidden="true">☾</span>
  <span class="edge-theme-text">Tema escuro</span>
</button>
<script>
(function(){
  function applyTheme(theme){
    var next = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('edge-theme', next); } catch(e) {}
    var btn = document.getElementById('edgeThemeToggle');
    if (btn) {
      var icon = btn.querySelector('.edge-theme-icon');
      var text = btn.querySelector('.edge-theme-text');
      if (icon) icon.textContent = next === 'dark' ? '☀' : '☾';
      if (text) text.textContent = next === 'dark' ? 'Tema claro' : 'Tema escuro';
      btn.setAttribute('aria-label', next === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro');
      btn.setAttribute('title', next === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro');
    }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'dark' ? '#15191e' : '#f4f7f6');
  }
  function initThemeToggle(){
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current);
    var btn = document.getElementById('edgeThemeToggle');
    if (btn) btn.addEventListener('click', function(){
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initThemeToggle);
  else initThemeToggle();
})();
</script>
</body>
</html>
