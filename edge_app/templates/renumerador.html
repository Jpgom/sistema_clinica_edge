<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fb"><title>Renumerador</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=edge-theme-20260923">
<link rel="stylesheet" href="{{ url_for('static', filename='ui-shell.css') }}?v=edge-ui-20260924"><meta name="csrf-token" content="{{ csrf_token() }}">
<script>
(function(){
  try {
    var saved = localStorage.getItem('edge-theme');
    var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
</head>
<body>
<div class="app-layout">
  {% include "_sidebar.html" %}
  <main class="main-area">
    <div class="topbar compact-topbar"><div class="page-title"><h1>Renumerador de Recibos</h1></div></div>
    <section class="content-card">
      {% with messages = get_flashed_messages() %}{% for m in messages %}<div class="alert error">{{ m }}</div>{% endfor %}{% endwith %}
      <form method="POST" enctype="multipart/form-data" autocomplete="off" data-download-reset="1">
        <div class="form-grid">
          <div class="field col-2"><label for="arquivo">Arquivo .docx ou .zip</label><input type="file" id="arquivo" name="arquivo" accept=".docx,.zip" required></div>
          <div class="field col-2"><label for="nova_data">Nova data</label><input type="text" id="nova_data" name="nova_data" placeholder="dd/mm/aaaa" required></div>
        </div>
        <div class="actions"><button class="btn btn--primary" type="submit">Processar</button><button class="btn btn--light" type="reset">Limpar formulário</button></div>
      </form>
    </section>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>

<script src="{{ url_for('static', filename='ui-shell.js') }}?v=edge-ui-20260924"></script>
</body></html>
