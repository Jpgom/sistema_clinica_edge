{% extends 'base.html' %}{% block title %}Editar competência · EDGE{% endblock %}{% block content %}
<div class="breadcrumbs"><a href="{{ url_for('unit_dashboard',unit_id=campaign.unit_id) }}">{{ campaign.unit_name }}</a><span>/</span><a href="{{ url_for('campaign_detail',campaign_id=campaign.id) }}">{{ month_label(campaign.month,campaign.year) }}</a><span>/</span><strong>Editar</strong></div>
<div class="page-head"><div><div class="eyebrow">CONFIGURAÇÃO</div><h1>Editar competência</h1><p>Altere unidade, mês, ano e informações internas.</p></div></div>
<div class="card" style="max-width:920px"><form method="post"><div class="grid grid-3"><div class="form-group"><label>Unidade</label><select class="form-control" name="unit_id" required>{% for u in units %}<option value="{{ u.id }}" {% if u.id==campaign.unit_id %}selected{% endif %}>{{ u.name }}{% if not u.active %} · INATIVA{% endif %}</option>{% endfor %}</select></div><div class="form-group"><label>Mês</label><select class="form-control" name="month">{% for n,name in MONTHS.items() %}<option value="{{ n }}" {% if n==campaign.month %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div><div class="form-group"><label>Ano</label><input class="form-control" type="number" name="year" value="{{ campaign.year }}" min="2020" max="2100"></div></div><div class="form-group"><label>Título interno opcional</label><input class="form-control" name="title" value="{{ campaign.title or '' }}" placeholder="Ex.: Clientes Macapá - Outubro"></div><div class="form-group"><label>Observações internas</label><textarea class="form-control" name="notes">{{ campaign.notes or '' }}</textarea></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('campaign_detail',campaign_id=campaign.id) }}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div></form></div>
{% endblock %}
