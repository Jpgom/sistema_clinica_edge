<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><title>Entrar</title></head><body><div class="login-shell"><div class="login-card"><h1>EDGE</h1><p class="muted">Convocação de Exames Periódicos</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><div class="form-group"><label>Senha administrativa</label><input class="form-control" type="password" name="password" required autofocus></div><button class="btn btn-primary" style="width:100%">Entrar</button></form></div></div></body></html>
