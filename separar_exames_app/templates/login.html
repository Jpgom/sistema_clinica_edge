<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDGE | Acesso</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="login-body"><main class="login-card"><div class="login-brand"><span class="brand-mark">E</span><div><strong>EDGE</strong><small>Extrator de Exames</small></div></div><p class="eyebrow">ACESSO PROTEGIDO</p><h1>Entrar no sistema</h1><p class="lead">Informe a senha configurada para acessar os documentos.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post"><label class="field-label">Senha</label><input class="text-input" type="password" name="password" autofocus required><button class="btn primary full" type="submit">Entrar</button></form><small class="login-version">v{{ version }}</small></main></body></html>
