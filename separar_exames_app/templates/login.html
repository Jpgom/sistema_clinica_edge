<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDGE | Acesso</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=edge-theme-20260923">
<script>
(function(){
  try {
    var saved = localStorage.getItem('edge-theme');
    var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
</head>
<body class="login-body"><main class="login-card"><div class="login-brand"><span class="brand-mark">E</span><div><strong>EDGE</strong><small>Extrator de Exames</small></div></div><p class="eyebrow">ACESSO PROTEGIDO</p><h1>Entrar no sistema</h1><p class="lead">Informe a senha configurada para acessar os documentos.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post"><label class="field-label">Senha</label><input class="text-input" type="password" name="password" autofocus required><button class="btn primary full" type="submit">Entrar</button></form><small class="login-version">v{{ version }}</small></main>
<button type="button" class="edge-theme-toggle" id="edgeThemeToggle" aria-label="Alternar tema" title="Alternar tema">
  <span class="edge-theme-icon" aria-hidden="true">☾</span>
  <span class="edge-theme-text">Tema escuro</span>
</button>
<script>
(function(){
  function applyTheme(theme){
    var next = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('edge-theme', next); } catch(e) {}
    var btn = document.getElementById('edgeThemeToggle');
    if (btn) {
      var icon = btn.querySelector('.edge-theme-icon');
      var text = btn.querySelector('.edge-theme-text');
      if (icon) icon.textContent = next === 'dark' ? '☀' : '☾';
      if (text) text.textContent = next === 'dark' ? 'Tema claro' : 'Tema escuro';
      btn.setAttribute('aria-label', next === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro');
      btn.setAttribute('title', next === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro');
    }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'dark' ? '#15191e' : '#f4f7f6');
  }
  function initThemeToggle(){
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current);
    var btn = document.getElementById('edgeThemeToggle');
    if (btn) btn.addEventListener('click', function(){
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initThemeToggle);
  else initThemeToggle();
})();
</script>
</body></html>
